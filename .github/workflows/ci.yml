name: CI - Build and Test

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

permissions:
  id-token: write
  contents: read    

jobs:
  build:
    name: Build & Test Node App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run application sanity check
        run: |
          node index.js &
          sleep 5
          curl http://localhost:3000/health

      - name: "Create version number"
        run: |
          echo "VERSION_NUMBER=${RANDOM}" >> $GITHUB_ENV

      - name: "Build a Docker image from the repo v1"
        run:  | 
          docker build -t  ${{ secrets.DOCKER_HUB_USERNAME }}/credpal-app:${{ env.VERSION_NUMBER}} .

      - name: "Log into Docker Hub"
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: "Push to Docker Hub"
        run: |
          docker push  ${{ secrets.DOCKER_HUB_USERNAME }}/credpal-app:${{ env.VERSION_NUMBER }}


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}




      - name: Render ECS task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-def.json
          container-name: app
          image:  ${{ secrets.DOCKER_HUB_USERNAME }}/credpal-app:${{ env.VERSION_NUMBER }}

    
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          cluster: credpal-cluster
          service: credpal-service
          task-definition: ecs-task-def.json
          wait-for-service-stability: true 